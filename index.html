<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnaud Freycenon — Architecte</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            padding: 60px 30px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: 400;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 300;
            color: #666666;
        }

        .line {
            width: 60px;
            height: 1px;
            background: #222222;
            margin: 45px 0;
        }

        .portfolio {
            display: inline-block;
            padding: 14px 28px;
            border: 1px solid #222222;
            color: #222222;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .portfolio:hover {
            background: #222222;
            color: #ffffff;
        }

        footer {
            margin-top: 80px;
            font-size: 12px;
            color: #999999;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Arnaud Freycenon</h1>

        <div class="subtitle">
            Architecte
        </div>

        <div class="line"></div>

        <a class="portfolio"
           href="arnaud_freycenon_architecte.pdf"
           target="_blank">
            Voir le portfolio
        </a>

        <footer>
            Portfolio — Arnaud Freycenon
        </footer>

    </main>

</body>
</html>
